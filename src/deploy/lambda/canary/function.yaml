# This file defines spec of a Lambda function. See https://pipecd.dev/docs/user-guide/configuration-reference/#specific-functionyaml for other options.
apiVersion: pipecd.dev/v1beta1
kind: LambdaFunction
spec:
  name: PipeCDTutorial_Canary
  role: <IAM_ROLE_ARN> # [EDIT_HERE] The ARN of the function’s execution role.
  # Using zip deployment instead of container image for simpler setup
  source:
    s3Bucket: <S3_BUCKET_NAME> # [EDIT_HERE] S3 bucket containing your zip file
    s3Key: <S3_KEY_PATH> # [EDIT_HERE] S3 key path to your zip file (e.g., lambda/pipecd-tutorial-canary.zip)
  runtime: python3.9
  handler: index.lambda_handler
  memory: 512
  timeout: 30
  environment:
    FUNCTION_VERSION: "v2.0.0"
    DEPLOYMENT_TYPE: "canary"